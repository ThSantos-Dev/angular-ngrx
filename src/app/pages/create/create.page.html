<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Novo post</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-header></app-header>

  <form class="title">
    <h1>Compartilhe suas ideias!</h1>
    <p>
      Escreva um post bem legal!
    </p>

    <ion-item>
      <ion-label position="floating">Título</ion-label>
      <ion-input [(ngModel)]="post.title" name="title"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Conteúdo</ion-label>
      <ion-textarea [(ngModel)]="post.body" name="body"></ion-textarea>
    </ion-item>
  </form>

  <button (click)="createPost()">Criar novo post</button>


</ion-content>
